<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />

  <title>График работы 2/2</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <script>
    // Ставлю тему до отрисовки страницы, чтобы она не мигала при загрузке
    (function () {
      let theme = "system";

      try {
        theme = localStorage.getItem("selectedTheme") || "system";
      } catch (error) {}

      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: light)").matches
          ? "light"
          : "dark";
      }

      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --border: #30363d;

      --text: #f0f6fc;
      --text-secondary: #c9d1d9;
      --muted: #8b949e;

      --work: #ff7b72;
      --work-bg: rgba(248, 81, 73, 0.14);
      --work-border: rgba(248, 81, 73, 0.28);

      --off: #56d364;
      --off-bg: rgba(46, 160, 67, 0.16);
      --off-border: rgba(46, 160, 67, 0.32);

      --accent: #58a6ff;
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-2: #f3f4f6;
      --border: #d0d7de;

      --text: #1f2328;
      --text-secondary: #24292f;
      --muted: #656d76;

      --work: #cf222e;
      --work-bg: rgba(207, 34, 46, 0.08);
      --work-border: rgba(207, 34, 46, 0.22);

      --off: #1a7f37;
      --off-bg: rgba(26, 127, 55, 0.08);
      --off-border: rgba(26, 127, 55, 0.22);

      --accent: #0969da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    button {
      font: inherit;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .container {
      width: min(100% - 24px, 720px);
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .switcher {
      display: grid;
      gap: 8px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .shift-switcher {
      grid-template-columns: repeat(2, 1fr);
    }

    .theme-switcher {
      grid-template-columns: repeat(3, 1fr);
    }

    .switch-button {
      width: 100%;
      padding: 11px 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .switch-button.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      text-align: center;
    }

    .status-label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .status.work {
      color: var(--work);
    }

    .status.off {
      color: var(--off);
    }

    .today-date {
      color: var(--text-secondary);
      font-size: 15px;
    }

    .next-days {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .info-title {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 17px;
      font-weight: 700;
    }

    .calendar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      /* Горизонтальный свайп обрабатываю сам, вертикальная прокрутка остаётся браузеру */
      touch-action: pan-y;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .month-title {
      font-size: 21px;
      font-weight: 750;
      text-align: center;
      flex: 1;
      text-transform: capitalize;
    }

    .calendar-nav-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
    }

    @media (hover: hover) {
      .calendar-nav-button:hover,
      .today-button:hover {
        border-color: var(--muted);
      }

      .switch-button:not(.active):hover {
        background: var(--surface-2);
        color: var(--text);
      }
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding-bottom: 5px;
    }

    .day {
      position: relative;
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 12px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }

    .day.work {
      background: var(--work-bg);
      color: var(--work);
      border-color: var(--work-border);
    }

    .day.off {
      background: var(--off-bg);
      color: var(--off);
      border-color: var(--off-border);
    }

    .day.today {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .day.today::after {
      content: "";
      position: absolute;
      bottom: 5px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .month-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
    }

    .stat-card.work .stat-value {
      color: var(--work);
    }

    .stat-card.off .stat-value {
      color: var(--off);
    }

    .stat-card.hours .stat-value {
      color: var(--accent);
    }

    .hours-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.work {
      background: var(--work);
    }

    .dot.off {
      background: var(--off);
    }

    .dot.today {
      background: var(--accent);
    }

    .today-button {
      display: block;
      width: 100%;
      padding: 11px 14px;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .today-button[hidden] {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 16px, 720px);
        padding-top: 14px;
      }

      h1 {
        font-size: 24px;
      }

      .status {
        font-size: 28px;
      }

      .calendar {
        padding: 12px;
      }

      .days,
      .weekdays {
        gap: 5px;
      }

      .day {
        border-radius: 9px;
        font-size: 14px;
      }

      .month-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .next-days {
        grid-template-columns: 1fr;
      }

      .theme-switcher {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>График работы</h1>
    <p class="subtitle">2 рабочих / 2 выходных</p>

    <div class="controls">
      <div class="switcher shift-switcher">
        <button class="switch-button" data-shift="shift1">Смена 1</button>
        <button class="switch-button" data-shift="shift2">Смена 2</button>
      </div>

      <div class="switcher theme-switcher">
        <button class="switch-button" data-theme-choice="system">Система</button>
        <button class="switch-button" data-theme-choice="light">Светлая</button>
        <button class="switch-button" data-theme-choice="dark">Тёмная</button>
      </div>
    </div>

    <section class="status-card">
      <div class="status-label">Сегодня</div>
      <div id="status" class="status"></div>
      <div id="todayDate" class="today-date"></div>
    </section>

    <section class="next-days">
      <div class="info-card">
        <div id="offTitle" class="info-title"></div>
        <div id="offValue" class="info-value"></div>
      </div>

      <div class="info-card">
        <div id="workTitle" class="info-title"></div>
        <div id="workValue" class="info-value"></div>
      </div>
    </section>

    <section id="calendar" class="calendar">
      <div class="calendar-header">
        <button id="prevMonth" class="calendar-nav-button" aria-label="Предыдущий месяц">‹</button>
        <div id="monthTitle" class="month-title"></div>
        <button id="nextMonth" class="calendar-nav-button" aria-label="Следующий месяц">›</button>
      </div>

      <div class="weekdays">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>
      </div>

      <div id="days" class="days"></div>

      <div class="month-stats">
        <div class="stat-card work">
          <div id="monthShifts" class="stat-value">0</div>
          <div class="stat-label">Смен</div>
        </div>

        <div class="stat-card off">
          <div id="monthDaysOff" class="stat-value">0</div>
          <div class="stat-label">Выходных</div>
        </div>

        <div class="stat-card hours">
          <div id="monthHours" class="stat-value">0</div>
          <div class="stat-label">Рабочих часов</div>
        </div>

        <div class="stat-card">
          <div id="monthDays" class="stat-value">0</div>
          <div class="stat-label">Дней в месяце</div>
        </div>
      </div>

      <div class="hours-note">
        Смена 12 часов · 1 час обед · учитывается 11 рабочих часов
      </div>

      <div class="legend">
        <div class="legend-item"><span class="dot off"></span>Выходной</div>
        <div class="legend-item"><span class="dot work"></span>Работа</div>
        <div class="legend-item"><span class="dot today"></span>Сегодня</div>
      </div>

      <button id="goToday" class="today-button">
        Вернуться к текущему месяцу
      </button>
    </section>
  </main>

  <script>
    // День, от которого отсчитывается цикл смен
    const ANCHOR_DATE = new Date(2026, 8, 23);

    const SCHEDULES = {
      shift1: ["off", "off", "work", "work"],
      shift2: ["work", "work", "off", "off"]
    };

    const THEMES = ["system", "light", "dark"];

    const SHIFT_HOURS = 12;
    const LUNCH_HOURS = 1;
    const PAID_HOURS = SHIFT_HOURS - LUNCH_HOURS;

    // Минимальная длина горизонтального свайпа в пикселях
    const SWIPE_DISTANCE = 50;

    const MONTHS = [
      "январь", "февраль", "март", "апрель", "май", "июнь",
      "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"
    ];

    const MONTHS_GENITIVE = [
      "января", "февраля", "марта", "апреля", "мая", "июня",
      "июля", "августа", "сентября", "октября", "ноября", "декабря"
    ];

    const $ = (id) => document.getElementById(id);

    // localStorage может быть недоступен (приватный режим) или хранить мусор
    function loadSetting(key, allowed, fallback) {
      try {
        const value = localStorage.getItem(key);
        return allowed.includes(value) ? value : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function saveSetting(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        // Без сохранения настройка просто живёт до перезагрузки
      }
    }

    let selectedShift = loadSetting("selectedShift", Object.keys(SCHEDULES), "shift1");
    let selectedTheme = loadSetting("selectedTheme", THEMES, "system");

    let today = startOfToday();
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();

    // ---------- Даты ----------

    function startOfToday() {
      const date = new Date();
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function addDays(date, days) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
    }

    function daysBetween(date1, date2) {
      const utc1 = Date.UTC(date1.getFullYear(), date1.getMonth(), date1.getDate());
      const utc2 = Date.UTC(date2.getFullYear(), date2.getMonth(), date2.getDate());
      return Math.round((utc1 - utc2) / 86400000);
    }

    function isSameDate(date1, date2) {
      return daysBetween(date1, date2) === 0;
    }

    function isCurrentMonthShown() {
      return viewYear === today.getFullYear() && viewMonth === today.getMonth();
    }

    function formatDate(date) {
      return `${formatShortDate(date)} ${date.getFullYear()}`;
    }

    function formatShortDate(date) {
      return `${date.getDate()} ${MONTHS_GENITIVE[date.getMonth()]}`;
    }

    function formatRange(start, end) {
      if (start.getMonth() === end.getMonth()) {
        return `${start.getDate()}–${end.getDate()} ${MONTHS_GENITIVE[end.getMonth()]}`;
      }

      return `${formatShortDate(start)} – ${formatShortDate(end)}`;
    }

    // ---------- График ----------

    function getDayType(date) {
      const cycle = SCHEDULES[selectedShift];
      const diff = daysBetween(date, ANCHOR_DATE);
      return cycle[((diff % cycle.length) + cycle.length) % cycle.length];
    }

    // Подряд идущие дни одного типа, в которые попадает date
    function getBlock(date) {
      const type = getDayType(date);
      const maxLength = SCHEDULES[selectedShift].length;
      let start = date;
      let end = date;

      for (let i = 0; i < maxLength && getDayType(addDays(start, -1)) === type; i++) {
        start = addDays(start, -1);
      }

      for (let i = 0; i < maxLength && getDayType(addDays(end, 1)) === type; i++) {
        end = addDays(end, 1);
      }

      return { type, start, end };
    }

    // Текст карточки: идёт ли этот тип дней сейчас или когда будет следующий
    function describeBlock(type) {
      const current = getBlock(today);
      const names = {
        off: { now: "Сейчас выходные", next: "Следующие выходные" },
        work: { now: "Сейчас рабочие дни", next: "Следующие рабочие дни" }
      };

      if (current.type === type) {
        let value = `по ${formatShortDate(current.end)}`;

        if (isSameDate(current.end, today)) {
          value = "Сегодня последний день";
        } else if (isSameDate(current.end, addDays(today, 1))) {
          value = "Сегодня и завтра";
        }

        return { title: names[type].now, value };
      }

      let block = getBlock(addDays(current.end, 1));

      while (block.type !== type) {
        block = getBlock(addDays(block.end, 1));
      }

      return { title: names[type].next, value: formatRange(block.start, block.end) };
    }

    // ---------- Отрисовка ----------

    function renderButtons() {
      document.querySelectorAll("[data-shift]").forEach((button) => {
        const active = button.dataset.shift === selectedShift;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active);
      });

      document.querySelectorAll("[data-theme-choice]").forEach((button) => {
        const active = button.dataset.themeChoice === selectedTheme;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active);
      });
    }

    function renderStatus() {
      const type = getDayType(today);
      const status = $("status");

      status.textContent = type === "work" ? "Рабочий день" : "Выходной";
      status.className = `status ${type}`;
      $("todayDate").textContent = formatDate(today);

      const off = describeBlock("off");
      $("offTitle").textContent = off.title;
      $("offValue").textContent = off.value;

      const work = describeBlock("work");
      $("workTitle").textContent = work.title;
      $("workValue").textContent = work.value;
    }

    function renderCalendar() {
      const days = $("days");
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      // Неделя с понедельника: воскресенье (0) уходит в конец
      const firstWeekday = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
      let workDays = 0;

      $("monthTitle").textContent = `${MONTHS[viewMonth]} ${viewYear}`;
      days.innerHTML = "";

      for (let i = 0; i < firstWeekday; i++) {
        days.appendChild(document.createElement("div"));
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(viewYear, viewMonth, day);
        const type = getDayType(date);
        const cell = document.createElement("div");

        if (type === "work") {
          workDays++;
        }

        cell.className = `day ${type}`;
        cell.textContent = day;
        cell.setAttribute(
          "aria-label",
          `${formatShortDate(date)}, ${type === "work" ? "рабочий" : "выходной"}`
        );

        if (isSameDate(date, today)) {
          cell.classList.add("today");
        }

        days.appendChild(cell);
      }

      $("monthShifts").textContent = workDays;
      $("monthDaysOff").textContent = daysInMonth - workDays;
      $("monthHours").textContent = workDays * PAID_HOURS;
      $("monthDays").textContent = daysInMonth;

      $("goToday").hidden = isCurrentMonthShown();
    }

    function renderAll() {
      renderButtons();
      renderStatus();
      renderCalendar();
    }

    // ---------- Тема ----------

    function applyTheme() {
      let theme = selectedTheme;

      if (theme === "system") {
        theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }

      document.documentElement.dataset.theme = theme;
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", theme === "light" ? "#f6f8fa" : "#0d1117");
    }

    // ---------- Действия ----------

    function selectShift(shift) {
      selectedShift = shift;
      saveSetting("selectedShift", shift);
      renderAll();
    }

    function selectTheme(theme) {
      selectedTheme = theme;
      saveSetting("selectedTheme", theme);
      applyTheme();
      renderButtons();
    }

    function changeMonth(delta) {
      const date = new Date(viewYear, viewMonth + delta, 1);
      viewYear = date.getFullYear();
      viewMonth = date.getMonth();
      renderCalendar();
    }

    function goToCurrentMonth() {
      viewYear = today.getFullYear();
      viewMonth = today.getMonth();
      renderCalendar();
    }

    // Если страница была открыта со вчера, переключаю «сегодня» на новый день
    function refreshToday() {
      const now = startOfToday();

      if (isSameDate(now, today)) {
        return;
      }

      const wasOnCurrentMonth = isCurrentMonthShown();
      today = now;

      if (wasOnCurrentMonth) {
        viewYear = today.getFullYear();
        viewMonth = today.getMonth();
      }

      renderAll();
    }

    function scheduleMidnightRefresh() {
      const msToMidnight = addDays(startOfToday(), 1) - Date.now();

      setTimeout(() => {
        refreshToday();
        scheduleMidnightRefresh();
      }, msToMidnight + 1000);
    }

    function setupSwipe() {
      const calendar = $("calendar");
      let start = null;

      calendar.addEventListener("touchstart", (event) => {
        const touch = event.changedTouches[0];
        start = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });

      calendar.addEventListener("touchend", (event) => {
        if (!start) {
          return;
        }

        const touch = event.changedTouches[0];
        const dx = touch.clientX - start.x;
        const dy = touch.clientY - start.y;
        start = null;

        if (Math.abs(dx) > SWIPE_DISTANCE && Math.abs(dx) > Math.abs(dy) * 1.5) {
          changeMonth(dx < 0 ? 1 : -1);
        }
      }, { passive: true });
    }

    // ---------- Запуск ----------

    document.querySelectorAll("[data-shift]").forEach((button) => {
      button.addEventListener("click", () => selectShift(button.dataset.shift));
    });

    document.querySelectorAll("[data-theme-choice]").forEach((button) => {
      button.addEventListener("click", () => selectTheme(button.dataset.themeChoice));
    });

    $("prevMonth").addEventListener("click", () => changeMonth(-1));
    $("nextMonth").addEventListener("click", () => changeMonth(1));
    $("goToday").addEventListener("click", goToCurrentMonth);

    matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => {
      if (selectedTheme === "system") {
        applyTheme();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        refreshToday();
      }
    });

    window.addEventListener("focus", refreshToday);

    applyTheme();
    renderAll();
    setupSwipe();
    scheduleMidnightRefresh();

    // Офлайн-режим работает только по http(s), с диска service worker не включится
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("sw.js").catch((error) => {
        console.warn("Не удалось включить офлайн-режим", error);
      });
    }
  </script>
</body>
</html>
