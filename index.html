<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />

  <title>График работы 2/2</title>

  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --border: #30363d;

      --text: #f0f6fc;
      --text-secondary: #c9d1d9;
      --muted: #8b949e;

      --work: #ff7b72;
      --work-bg: rgba(248, 81, 73, 0.14);
      --work-border: rgba(248, 81, 73, 0.28);

      --off: #56d364;
      --off-bg: rgba(46, 160, 67, 0.16);
      --off-border: rgba(46, 160, 67, 0.32);

      --accent: #58a6ff;
    }

    [data-theme="light"] {
      --bg: #f6f8fa;
      --surface: #ffffff;
      --surface-2: #f3f4f6;
      --border: #d0d7de;

      --text: #1f2328;
      --text-secondary: #24292f;
      --muted: #656d76;

      --work: #cf222e;
      --work-bg: rgba(207, 34, 46, 0.08);
      --work-border: rgba(207, 34, 46, 0.22);

      --off: #1a7f37;
      --off-bg: rgba(26, 127, 55, 0.08);
      --off-border: rgba(26, 127, 55, 0.22);

      --accent: #0969da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .container {
      width: min(100% - 24px, 720px);
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 18px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .switcher {
      display: grid;
      gap: 8px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .shift-switcher {
      grid-template-columns: repeat(2, 1fr);
    }

    .theme-switcher {
      grid-template-columns: repeat(3, 1fr);
    }

    .switch-button {
      width: 100%;
      height: auto;
      padding: 11px 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .switch-button.active {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }

    .status-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      text-align: center;
    }

    .status-label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .status {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .status.work {
      color: var(--work);
    }

    .status.off {
      color: var(--off);
    }

    .today-date {
      color: var(--text-secondary);
      font-size: 15px;
    }

    .next-days {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .info-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .info-title {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 17px;
      font-weight: 700;
    }

    .calendar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .month-title {
      font-size: 21px;
      font-weight: 750;
      text-align: center;
      flex: 1;
      text-transform: capitalize;
    }

    .calendar-nav-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
    }

    .calendar-nav-button:hover,
    .today-button:hover,
    .switch-button:hover {
      filter: brightness(0.97);
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding-bottom: 5px;
    }

    .day {
      position: relative;
      aspect-ratio: 1;
      min-width: 0;
      border-radius: 12px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
    }

    .day.work {
      background: var(--work-bg);
      color: var(--work);
      border-color: var(--work-border);
    }

    .day.off {
      background: var(--off-bg);
      color: var(--off);
      border-color: var(--off-border);
    }

    .day.empty {
      background: transparent;
    }

    .day.today {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .day.today::after {
      content: "";
      position: absolute;
      bottom: 5px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    .month-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .stat-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
    }

    .stat-card.work .stat-value {
      color: var(--work);
    }

    .stat-card.off .stat-value {
      color: var(--off);
    }

    .stat-card.hours .stat-value {
      color: var(--accent);
    }

    .hours-note {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 13px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.work {
      background: var(--work);
    }

    .dot.off {
      background: var(--off);
    }

    .dot.today {
      background: var(--accent);
    }

    .today-button {
      display: block;
      width: 100%;
      height: auto;
      padding: 11px 14px;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 16px, 720px);
        padding-top: 14px;
      }

      h1 {
        font-size: 24px;
      }

      .status {
        font-size: 28px;
      }

      .calendar {
        padding: 12px;
      }

      .days,
      .weekdays {
        gap: 5px;
      }

      .day {
        border-radius: 9px;
        font-size: 14px;
      }

      .month-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .next-days {
        grid-template-columns: 1fr;
      }

      .theme-switcher {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>График работы</h1>
    <p class="subtitle">2 рабочих / 2 выходных</p>

    <div class="controls">

      <div class="switcher shift-switcher">
        <button id="shift1Button" class="switch-button">
          Смена 1
        </button>

        <button id="shift2Button" class="switch-button">
          Смена 2
        </button>
      </div>

      <div class="switcher theme-switcher">
        <button id="themeSystem" class="switch-button">
          Система
        </button>

        <button id="themeLight" class="switch-button">
          Светлая
        </button>

        <button id="themeDark" class="switch-button">
          Тёмная
        </button>
      </div>

    </div>

    <section class="status-card">
      <div class="status-label">Сегодня</div>
      <div id="status" class="status"></div>
      <div id="todayDate" class="today-date"></div>
    </section>

    <section class="next-days">

      <div class="info-card">
        <div class="info-title">Следующие выходные</div>
        <div id="nextDaysOff" class="info-value"></div>
      </div>

      <div class="info-card">
        <div class="info-title">Следующие рабочие дни</div>
        <div id="nextWorkDays" class="info-value"></div>
      </div>

    </section>

    <section class="calendar">

      <div class="calendar-header">
        <button
          id="prevMonth"
          class="calendar-nav-button"
          aria-label="Предыдущий месяц"
        >
          ‹
        </button>

        <div id="monthTitle" class="month-title"></div>

        <button
          id="nextMonth"
          class="calendar-nav-button"
          aria-label="Следующий месяц"
        >
          ›
        </button>
      </div>

      <div class="weekdays">
        <div class="weekday">Пн</div>
        <div class="weekday">Вт</div>
        <div class="weekday">Ср</div>
        <div class="weekday">Чт</div>
        <div class="weekday">Пт</div>
        <div class="weekday">Сб</div>
        <div class="weekday">Вс</div>
      </div>

      <div id="days" class="days"></div>

      <div class="month-stats">

        <div class="stat-card work">
          <div id="monthShifts" class="stat-value">0</div>
          <div class="stat-label">Смен</div>
        </div>

        <div class="stat-card off">
          <div id="monthDaysOff" class="stat-value">0</div>
          <div class="stat-label">Выходных</div>
        </div>

        <div class="stat-card hours">
          <div id="monthHours" class="stat-value">0</div>
          <div class="stat-label">Рабочих часов</div>
        </div>

        <div class="stat-card">
          <div id="monthDays" class="stat-value">0</div>
          <div class="stat-label">Дней в месяце</div>
        </div>

      </div>

      <div class="hours-note">
        Смена 12 часов · 1 час обед · учитывается 11 рабочих часов
      </div>

      <div class="legend">

        <div class="legend-item">
          <span class="dot off"></span>
          Выходной
        </div>

        <div class="legend-item">
          <span class="dot work"></span>
          Работа
        </div>

        <div class="legend-item">
          <span class="dot today"></span>
          Сегодня
        </div>

      </div>

      <button id="goToday" class="today-button">
        Вернуться к текущему месяцу
      </button>

    </section>

  </main>

  <script>
    const anchorDate = new Date(2026, 8, 23);

    const schedules = {
      shift1: ["off", "off", "work", "work"],
      shift2: ["work", "work", "off", "off"]
    };

    const shiftDuration = 12;
    const lunchHours = 1;
    const paidWorkHours = shiftDuration - lunchHours;

    let selectedShift =
      localStorage.getItem("selectedShift") || "shift1";

    let selectedTheme =
      localStorage.getItem("selectedTheme") || "system";

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();

    const monthNames = [
      "январь",
      "февраль",
      "март",
      "апрель",
      "май",
      "июнь",
      "июль",
      "август",
      "сентябрь",
      "октябрь",
      "ноябрь",
      "декабрь"
    ];

    const monthNamesGenitive = [
      "января",
      "февраля",
      "марта",
      "апреля",
      "мая",
      "июня",
      "июля",
      "августа",
      "сентября",
      "октября",
      "ноября",
      "декабря"
    ];

    function normalizeDate(date) {
      return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );
    }

    function getDifferenceInDays(date1, date2) {
      const utc1 = Date.UTC(
        date1.getFullYear(),
        date1.getMonth(),
        date1.getDate()
      );

      const utc2 = Date.UTC(
        date2.getFullYear(),
        date2.getMonth(),
        date2.getDate()
      );

      return Math.floor((utc1 - utc2) / 86400000);
    }

    function getDayType(date) {
      const diff = getDifferenceInDays(
        normalizeDate(date),
        anchorDate
      );

      const cycleDay = ((diff % 4) + 4) % 4;

      return schedules[selectedShift][cycleDay];
    }

    function isWorkDay(date) {
      return getDayType(date) === "work";
    }

    function isSameDate(date1, date2) {
      return (
        date1.getFullYear() === date2.getFullYear() &&
        date1.getMonth() === date2.getMonth() &&
        date1.getDate() === date2.getDate()
      );
    }

    function formatDate(date) {
      return `${date.getDate()} ${
        monthNamesGenitive[date.getMonth()]
      } ${date.getFullYear()}`;
    }

    function formatShortDate(date) {
      return `${date.getDate()} ${
        monthNamesGenitive[date.getMonth()]
      }`;
    }

    function findNextPair(type) {
      let date = new Date(today);

      for (let i = 0; i < 10; i++) {
        const currentType =
          isWorkDay(date) ? "work" : "off";

        const nextDate = new Date(date);
        nextDate.setDate(nextDate.getDate() + 1);

        const nextType =
          isWorkDay(nextDate) ? "work" : "off";

        if (
          currentType === type &&
          nextType === type
        ) {
          return [
            new Date(date),
            nextDate
          ];
        }

        date.setDate(date.getDate() + 1);
      }

      return null;
    }

    function updateShiftButtons() {
      document
        .getElementById("shift1Button")
        .classList.toggle(
          "active",
          selectedShift === "shift1"
        );

      document
        .getElementById("shift2Button")
        .classList.toggle(
          "active",
          selectedShift === "shift2"
        );
    }

    function selectShift(shift) {
      selectedShift = shift;

      localStorage.setItem(
        "selectedShift",
        selectedShift
      );

      updateShiftButtons();
      updateStatus();
      renderCalendar();
    }

    function getSystemTheme() {
      return window.matchMedia(
        "(prefers-color-scheme: light)"
      ).matches
        ? "light"
        : "dark";
    }

    function applyTheme() {
      const effectiveTheme =
        selectedTheme === "system"
          ? getSystemTheme()
          : selectedTheme;

      document.documentElement.setAttribute(
        "data-theme",
        effectiveTheme
      );

      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute(
          "content",
          effectiveTheme === "light"
            ? "#f6f8fa"
            : "#0d1117"
        );

      updateThemeButtons();
    }

    function updateThemeButtons() {
      document
        .getElementById("themeSystem")
        .classList.toggle(
          "active",
          selectedTheme === "system"
        );

      document
        .getElementById("themeLight")
        .classList.toggle(
          "active",
          selectedTheme === "light"
        );

      document
        .getElementById("themeDark")
        .classList.toggle(
          "active",
          selectedTheme === "dark"
        );
    }

    function selectTheme(theme) {
      selectedTheme = theme;

      localStorage.setItem(
        "selectedTheme",
        selectedTheme
      );

      applyTheme();
    }

    function updateStatus() {
      const status =
        document.getElementById("status");

      const todayDate =
        document.getElementById("todayDate");

      const work = isWorkDay(today);

      status.textContent =
        work
          ? "Рабочий день"
          : "Выходной";

      status.className =
        `status ${work ? "work" : "off"}`;

      todayDate.textContent =
        formatDate(today);

      const nextDaysOff =
        findNextPair("off");

      const nextWorkDays =
        findNextPair("work");

      document
        .getElementById("nextDaysOff")
        .textContent =
          `${formatShortDate(nextDaysOff[0])} — ${formatShortDate(nextDaysOff[1])}`;

      document
        .getElementById("nextWorkDays")
        .textContent =
          `${formatShortDate(nextWorkDays[0])} — ${formatShortDate(nextWorkDays[1])}`;
    }

    function updateMonthStats() {
      const daysInMonth =
        new Date(
          currentYear,
          currentMonth + 1,
          0
        ).getDate();

      let workDays = 0;
      let daysOff = 0;

      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {
        const date =
          new Date(
            currentYear,
            currentMonth,
            day
          );

        if (isWorkDay(date)) {
          workDays++;
        } else {
          daysOff++;
        }
      }

      const workHours =
        workDays * paidWorkHours;

      document
        .getElementById("monthShifts")
        .textContent = workDays;

      document
        .getElementById("monthDaysOff")
        .textContent = daysOff;

      document
        .getElementById("monthHours")
        .textContent = workHours;

      document
        .getElementById("monthDays")
        .textContent = daysInMonth;
    }

    function renderCalendar() {
      const daysContainer =
        document.getElementById("days");

      const monthTitle =
        document.getElementById("monthTitle");

      daysContainer.innerHTML = "";

      monthTitle.textContent =
        `${monthNames[currentMonth]} ${currentYear}`;

      const firstDay =
        new Date(
          currentYear,
          currentMonth,
          1
        );

      const daysInMonth =
        new Date(
          currentYear,
          currentMonth + 1,
          0
        ).getDate();

      let startDay =
        firstDay.getDay();

      startDay =
        startDay === 0
          ? 6
          : startDay - 1;

      for (
        let i = 0;
        i < startDay;
        i++
      ) {
        const empty =
          document.createElement("div");

        empty.className =
          "day empty";

        daysContainer.appendChild(
          empty
        );
      }

      for (
        let day = 1;
        day <= daysInMonth;
        day++
      ) {
        const date =
          new Date(
            currentYear,
            currentMonth,
            day
          );

        const dayElement =
          document.createElement("div");

        const work =
          isWorkDay(date);

        dayElement.className =
          `day ${work ? "work" : "off"}`;

        dayElement.textContent =
          day;

        if (
          isSameDate(
            date,
            today
          )
        ) {
          dayElement
            .classList
            .add("today");
        }

        daysContainer.appendChild(
          dayElement
        );
      }

      updateMonthStats();
    }

    document
      .getElementById("shift1Button")
      .addEventListener(
        "click",
        () => selectShift("shift1")
      );

    document
      .getElementById("shift2Button")
      .addEventListener(
        "click",
        () => selectShift("shift2")
      );

    document
      .getElementById("themeSystem")
      .addEventListener(
        "click",
        () => selectTheme("system")
      );

    document
      .getElementById("themeLight")
      .addEventListener(
        "click",
        () => selectTheme("light")
      );

    document
      .getElementById("themeDark")
      .addEventListener(
        "click",
        () => selectTheme("dark")
      );

    document
      .getElementById("prevMonth")
      .addEventListener(
        "click",
        () => {
          currentMonth--;

          if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
          }

          renderCalendar();
        }
      );

    document
      .getElementById("nextMonth")
      .addEventListener(
        "click",
        () => {
          currentMonth++;

          if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
          }

          renderCalendar();
        }
      );

    document
      .getElementById("goToday")
      .addEventListener(
        "click",
        () => {
          currentYear =
            today.getFullYear();

          currentMonth =
            today.getMonth();

          renderCalendar();
        }
      );

    window
      .matchMedia("(prefers-color-scheme: light)")
      .addEventListener("change", () => {
        if (selectedTheme === "system") {
          applyTheme();
        }
      });

    applyTheme();
    updateShiftButtons();
    updateStatus();
    renderCalendar();
  </script>
</body>
</html>
